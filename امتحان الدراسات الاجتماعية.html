<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>امتحان الدراسات الاجتماعية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column. Brand header, then the exam panel (month title, timer, forms, view mode, progress),
   the question navigator, the question card(s) or the result, and the copyright footer. */
:root{
  --bg:#edf0f8;
  --card:#ffffff;
  --card-2:#f6f8fd;
  --line:#d9e0ef;
  --line-strong:#c2cce3;
  --ink:#0e1730;
  --muted:#55627f;
  --accent:#2457e6;
  --accent-text:#1c4bd4;
  --accent-soft:#e5ecff;
  --on-accent:#ffffff;
  --q:#d4183d;
  --good:#0d7a50;
  --good-soft:#e1f4ea;
  --bad:#c4223a;
  --bad-soft:#fdeaed;
  --shadow:0 1px 2px rgba(18,30,66,.06),0 10px 28px -14px rgba(18,30,66,.22);
  --font-display:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1122;--card:#151b32;--card-2:#10162a;--line:#27315a;--line-strong:#38447a;
    --ink:#e8ecfa;--muted:#9aa6c9;--accent:#4d7bff;--accent-text:#8fb1ff;--accent-soft:#1b2a5c;--on-accent:#08102a;
    --q:#ff7f96;--good:#4fd69c;--good-soft:#12382b;--bad:#ff8294;--bad-soft:#3b1a25;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1122;--card:#151b32;--card-2:#10162a;--line:#27315a;--line-strong:#38447a;
  --ink:#e8ecfa;--muted:#9aa6c9;--accent:#4d7bff;--accent-text:#8fb1ff;--accent-soft:#1b2a5c;--on-accent:#08102a;
  --q:#ff7f96;--good:#4fd69c;--good-soft:#12382b;--bad:#ff8294;--bad-soft:#3b1a25;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.65 var(--font-body);
  padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
.app{max-width:720px;margin-inline:auto;display:grid;gap:16px;text-align:start}
.stack{display:grid;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-inline:4px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.logo img{width:38px;height:38px;display:block}
.brand-name{margin:0;font:800 clamp(22px,6.4vw,28px)/1 var(--font-display)}
.grade{display:grid;gap:2px;padding-inline-start:12px;border-inline-start:1.5px solid var(--line-strong)}
.grade strong{font:700 16px/1.3 var(--font-display)}
.grade span{font-size:14px;color:var(--muted)}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.panel{display:grid;gap:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.panel-title{display:flex;align-items:center;gap:10px;margin:0;min-width:0;font:700 19px/1.4 var(--font-display)}
.panel-title::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
.timer{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--card-2);font:700 17px var(--font-display);font-variant-numeric:tabular-nums;color:var(--accent-text)}
.timer .dot{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.timer.live .dot{background:var(--good);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* forms (النماذج) */
.forms{list-style:none;margin:0;padding:6px;display:flex;gap:6px;background:var(--card-2);border:1.5px solid var(--line);border-radius:20px}
.forms li{flex:1;min-width:0;min-height:50px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;padding:4px 10px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font:700 16px/1.3 var(--font-display);color:var(--muted);text-align:center}
.forms li.done{color:var(--good)}
.forms li[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px -8px var(--accent)}
.forms .sc{font-size:14px;font-variant-numeric:tabular-nums}

/* view mode */
.seg{display:flex;gap:6px;padding:6px;background:var(--card-2);border:1.5px solid var(--line);border-radius:24px}
.seg button{flex:1;min-width:0;min-height:52px;padding:0 8px;border:0;border-radius:18px;background:transparent;color:var(--muted);font:700 16px var(--font-display);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 18px -8px var(--accent)}

/* progress */
.progress{display:flex;align-items:center;gap:16px;padding-top:16px;border-top:1.5px solid var(--line)}
.progress p{margin:0;white-space:nowrap;font-weight:600;color:var(--muted)}
.progress b{color:var(--ink);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .3s ease}

/* navigator */
.navgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,60px));justify-content:center;gap:8px}
.n{position:relative;min-height:54px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--card-2);font:700 19px var(--font-display);font-variant-numeric:tabular-nums;cursor:pointer}
.n.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.n.answered::after{content:"";position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.n[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.n[aria-current="true"]::after{background:var(--on-accent)}

/* question */
.qcard{display:grid;gap:18px}
.qlabel{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.qtext{margin:0;font:700 22px/1.75 var(--font-display);color:var(--q);text-wrap:balance}
.opts{display:grid;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border:1.5px solid var(--line);border-radius:20px;background:var(--card-2);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.badge{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;border:1.5px solid var(--line-strong);background:var(--card);font:700 19px var(--font-display)}
.otext{min-width:0;font-size:19px;font-weight:500;overflow-wrap:anywhere}
.tick{margin-inline-start:auto;display:flex;color:var(--accent-text);opacity:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input:checked ~ .badge{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt input:checked ~ .tick{opacity:1}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

/* buttons */
.actions{display:grid;gap:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:54px;padding:0 20px;border-radius:16px;border:1.5px solid transparent;font:700 17px/1.3 var(--font-display);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 10px 20px -12px var(--accent)}
.btn.outline{background:transparent;border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{background:var(--card);border-color:var(--line-strong)}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{margin:0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--bad-soft);color:var(--bad);font-weight:600}
.note svg{flex:none;margin-top:3px}

/* result */
.result{display:grid;gap:20px}
.res-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;flex:none;width:116px;height:116px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 28px var(--font-display);font-variant-numeric:tabular-nums}
.ring b small{font-size:16px;font-weight:700;color:var(--muted)}
.res-text{flex:1;min-width:200px}
.kicker{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.res-text h2{margin:0;font:800 24px/1.4 var(--font-display)}
.res-text h2:focus{outline:none}
.res-text .sub{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 8px;border-radius:16px;background:var(--card-2);border:1.5px solid var(--line);text-align:center}
.stat b{display:block;font:800 22px/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--good)}
.stat.no b{color:var(--bad)}
.sec-title{margin:0;font:700 18px var(--font-display)}
.wrong-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.wrong-list>li{display:grid;gap:12px;padding:16px;border:1.5px solid var(--line);border-radius:20px;background:var(--card-2)}
.wq{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;min-width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--bad-soft);color:var(--bad);font:800 16px var(--font-display)}
.wq p{margin:0;font-weight:600;overflow-wrap:anywhere}
.ans{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;font-weight:600}
.ans svg{flex:none}
.ans .lab{font-weight:500;opacity:.9}
.ans.bad{background:var(--bad-soft);color:var(--bad)}
.ans.good{background:var(--good-soft);color:var(--good)}
.perfect{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--good-soft);color:var(--good);font-weight:600}
.perfect p{margin:0}
.decide h3{margin:0 0 14px;font:700 20px/1.6 var(--font-display)}
.choices{display:grid;gap:12px}
.sum-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sum-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;background:var(--card-2)}
.sum-list .nm{font:700 17px var(--font-display)}
.sum-list .mt{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sum-list .mt b{color:var(--ink);font:800 19px var(--font-display)}
.sum-list .mt span{display:inline-flex;align-items:center;gap:6px}

.foot{padding-top:8px;text-align:center;font-size:14px;color:var(--muted)}

@media (max-width:360px){
  .grade{padding-inline-start:0;border-inline-start:0}
}
@media (min-width:560px){
  .choices{grid-template-columns:1fr 1fr}
  .card{padding:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<script>
(function () {
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'ar');

  var FORMS = [
    { title: 'النموذج الأول', questions: [
      { q: 'أولى الحضارات التي ظهرت في العراق القديم هي ........', o: ['البابلية', 'السومرية', 'الأكادية', 'الآشورية'], a: 1 },

      { q: 'تحول نظام الحكم من الشورى إلى الوراثة في عهد الخلافة ........', o: ['الراشدة', 'الأموية', 'العثمانية', 'العباسية'], a: 1 }
    ] },
    { title: 'النموذج الثاني', questions: [
      { q: 'من أشهر الفنون القتالية التي برع فيها الصينيون ........', o: ['الكاراتيه', 'التايكوندو', 'الكونغ فو', 'المصارعة'], a: 2 },
      { q: 'من أسباب ازدهار النشاط التجاري في الصين وجود العملات المعدنية و........', o: ['طريق البخور', 'طريق الأخشاب', 'طريق الحرير', 'طريق الكتان'], a: 2 },
      { q: 'انقسم المجتمع الهندي القديم إلى ........ طبقات.', o: ['ثلاث', 'أربع', 'خمس', 'ست'], a: 1 },
      { q: 'أول قانون مدوَّن في بلاد العراق كان من الحضارة ........', o: ['الآشورية', 'السومرية', 'البابلية', 'الأكادية'], a: 1 },
      { q: 'عاصمة مملكة حمير هي ........', o: ['الجوف', 'قرناو', 'مأرب', 'ريدان'], a: 3 },
      { q: 'شيَّد الفينيقيون العديد من المراكز التجارية، منها مدينة ........', o: ['سومر', 'قرطاج', 'أوغاريت', 'آشور'], a: 1 }
    ] }
  ];

  var LETTERS = ['أ', 'ب', 'ج', 'د'];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (s) { return document.querySelector(s); };
  function svg(inner, size) {
    size = size || 20;
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }
  var ICON = {
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    lock: svg('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/>', 18),
    prev: svg('<path d="M9 6l6 6-6 6"/>'),
    next: svg('<path d="M15 6l-6 6 6 6"/>'),
    retry: svg('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
    list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),
    clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 18),
    info: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>', 20)
  };

  function newAttempt(f) {
    return { answers: new Array(f.questions.length).fill(null), done: false, score: null, startedAt: Date.now(), elapsed: 0 };
  }
  var state = { view: 'quiz', form: 0, mode: 'single', index: 0, confirm: false, forms: FORMS.map(newAttempt) };
  function F() { return FORMS[state.form]; }
  function S() { return state.forms[state.form]; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(sec) { return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
  function answeredCount() { return S().answers.filter(function (v) { return v !== null; }).length; }

  /* ---------- header parts ---------- */
  function renderTabs() {
    $('#tabs').innerHTML = FORMS.map(function (f, i) {
      var fs = state.forms[i];
      var current = state.view !== 'summary' && i === state.form;
      var done = fs.done;
      var locked = !current && !done;
      return '<li' + (done ? ' class="done"' : '') + (current ? ' aria-current="step"' : '') + '>' +
        (done ? ICON.check : locked ? ICON.lock : '') +
        '<span>' + f.title + '</span>' +
        (done ? '<span class="sc" dir="ltr">' + fs.score + '/' + f.questions.length + '</span>' : '') +
        (locked ? '<span class="sr">(غير متاح بعد)</span>' : '') +
        '</li>';
    }).join('');
  }

  function renderTimer() {
    var running = state.view === 'quiz';
    var fs = S();
    var sec = running ? Math.floor((Date.now() - fs.startedAt) / 1000) : fs.elapsed;
    $('#tval').textContent = fmt(sec);
    $('#timer').classList.toggle('live', running);
    $('#timer').hidden = state.view === 'summary';
  }

  function renderModes() {
    document.querySelectorAll('#modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
    });
  }

  function renderProgress() {
    var total = F().questions.length, n = answeredCount();
    $('#ptext').innerHTML = 'التقدم: <b>' + n + ' من ' + total + '</b>';
    $('#pbar').style.width = (n / total * 100) + '%';
    var w = $('#pbarwrap');
    w.setAttribute('aria-valuemax', total);
    w.setAttribute('aria-valuenow', n);
  }

  function renderNavigator() {
    var a = S().answers;
    var grid = $('#navgrid');
    grid.style.setProperty('--n', a.length);
    grid.innerHTML = a.map(function (v, i) {
      var cur = state.mode === 'single' && i === state.index;
      return '<button type="button" class="n' + (v !== null ? ' answered' : '') + '" data-action="goto" data-i="' + i + '"' +
        (cur ? ' aria-current="true"' : '') +
        ' aria-label="السؤال ' + (i + 1) + (v !== null ? '، تمت الإجابة' : '') + '">' + (i + 1) + '</button>';
    }).join('');
  }

  /* ---------- questions ---------- */
  function questionCard(i) {
    var f = F(), q = f.questions[i], sel = S().answers[i], total = f.questions.length;
    return '<article class="card qcard" id="qc' + i + '" aria-labelledby="qt' + i + '">' +
      '<p class="qlabel">السؤال ' + (i + 1) + ' من ' + total + '</p>' +
      '<h3 class="qtext" id="qt' + i + '">' + q.q + '</h3>' +
      '<div class="opts" role="radiogroup" aria-labelledby="qt' + i + '">' +
      q.o.map(function (t, j) {
        return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"' + (sel === j ? ' checked' : '') + '>' +
          '<span class="badge" aria-hidden="true">' + LETTERS[j] + '</span>' +
          '<span class="otext">' + t + '</span>' +
          '<span class="tick" aria-hidden="true">' + ICON.check + '</span></label>';
      }).join('') +
      '</div></article>';
  }

  function renderQuestions() {
    var n = F().questions.length, list = [];
    if (state.mode === 'single') list.push(state.index);
    else for (var i = 0; i < n; i++) list.push(i);
    $('#qs').innerHTML = list.map(questionCard).join('');
  }

  function renderActions() {
    var box = $('#actions');
    if (state.view !== 'quiz') { box.innerHTML = ''; return; }
    var total = F().questions.length, n = answeredCount(), missing = total - n;
    var single = state.mode === 'single';
    var strong = !single || n === total || state.index === total - 1;
    var html = '<div class="actions">';
    if (state.confirm && missing > 0) {
      html += '<p class="note" role="status">' + ICON.info + '<span>لم تجب عن ' + missing + (missing === 1 ? ' سؤال' : missing === 2 ? ' سؤالين' : ' أسئلة') +
        '. السؤال الذي بلا إجابة يُحسب خطأً. اضغط «تصحيح الآن» للمتابعة أو أكمل إجاباتك أولًا.</span></p>';
    }
    if (single) {
      html += '<div class="pair">' +
        '<button type="button" class="btn ghost" data-action="prev"' + (state.index === 0 ? ' disabled' : '') + '>' + ICON.prev + 'السابق</button>' +
        '<button type="button" class="btn ghost" data-action="next"' + (state.index === total - 1 ? ' disabled' : '') + '>التالي' + ICON.next + '</button>' +
        '</div>';
    }
    html += '<button type="button" class="btn ' + (strong ? 'primary' : 'outline') + '" data-action="finish">' +
      ICON.check + (state.confirm && missing > 0 ? 'تصحيح الآن' : 'إنهاء وتصحيح') + '</button></div>';
    box.innerHTML = html;
  }

  /* ---------- results ---------- */
  function verdict(pct) {
    if (pct === 100) return ['ممتاز! لم تخطئ في أي سؤال.', 'أجبت عن كل أسئلة هذا النموذج إجابة صحيحة.'];
    if (pct >= 67) return ['أحسنت! أداء جيد.', 'راجع الأسئلة الخاطئة أدناه وتعرّف على الإجابة الصحيحة.'];
    if (pct >= 50) return ['نتيجة مقبولة.', 'راجع الأسئلة الخاطئة أدناه ثم جرّب مرة أخرى.'];
    return ['تحتاج إلى مراجعة أكثر.', 'ذاكر الدرس جيدًا وراجع الأسئلة الخاطئة أدناه ثم أعد المحاولة.'];
  }

  function renderResult() {
    var f = F(), s = S(), total = f.questions.length;
    var correct = s.score, wrongN = total - correct;
    var pct = Math.round(correct / total * 100);
    var v = verdict(pct);
    var tone = pct >= 67 ? 'var(--good)' : pct >= 50 ? 'var(--accent)' : 'var(--bad)';
    var C = 2 * Math.PI * 46, dash = (C * pct / 100).toFixed(1);
    var wrong = f.questions.map(function (q, i) { return { q: q, i: i, a: s.answers[i] }; })
      .filter(function (x) { return x.a !== x.q.a; });
    var last = state.form === FORMS.length - 1;

    var wrongHTML = wrong.length === 0
      ? '<div class="perfect">' + ICON.check + '<p>لا توجد أسئلة خاطئة في هذا النموذج.</p></div>'
      : '<ol class="wrong-list">' + wrong.map(function (x) {
          return '<li><div class="wq"><span class="qn">' + (x.i + 1) + '</span><p>' + x.q.q + '</p></div>' +
            '<div class="ans bad">' + ICON.x + (x.a === null ? '<span>لم تجب عن هذا السؤال</span>' : '<span class="lab">إجابتك:</span><span>' + x.q.o[x.a] + '</span>') + '</div>' +
            '<div class="ans good">' + ICON.check + '<span class="lab">الإجابة الصحيحة:</span><span>' + x.q.o[x.q.a] + '</span></div></li>';
        }).join('') + '</ol>';

    var question = last
      ? 'أنهيت آخر نموذج. هل تريد عرض ملخص الامتحان أم إعادة ' + f.title + '؟'
      : 'هل تريد الانتقال إلى ' + FORMS[state.form + 1].title + ' أم إعادة ' + f.title + '؟';
    var primary = last
      ? '<button type="button" class="btn primary" data-action="summary">' + ICON.list + 'عرض ملخص الامتحان</button>'
      : '<button type="button" class="btn primary" data-action="nextform">الانتقال إلى ' + FORMS[state.form + 1].title + ICON.next + '</button>';

    $('#qs').innerHTML =
      '<section class="card result" aria-labelledby="res-title">' +
        '<div class="res-head">' +
          '<div class="ring"><svg viewBox="0 0 116 116" aria-hidden="true">' +
            '<circle cx="58" cy="58" r="46" fill="none" stroke="var(--line)" stroke-width="11"/>' +
            '<circle cx="58" cy="58" r="46" fill="none" stroke="' + tone + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + C.toFixed(1) + '"/>' +
          '</svg><b dir="ltr">' + correct + '<small>/' + total + '</small></b></div>' +
          '<div class="res-text"><p class="kicker">نتيجة ' + f.title + ' · <span dir="ltr">' + pct + '%</span></p>' +
          '<h2 id="res-title" tabindex="-1">' + v[0] + '</h2><p class="sub">' + v[1] + '</p></div>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat ok"><b>' + correct + '</b><span>إجابات صحيحة</span></div>' +
          '<div class="stat no"><b>' + wrongN + '</b><span>إجابات خاطئة</span></div>' +
          '<div class="stat"><b dir="ltr">' + fmt(s.elapsed) + '</b><span>الزمن</span></div>' +
        '</div>' +
        '<h3 class="sec-title">الأسئلة الخاطئة' + (wrong.length ? ' (' + wrong.length + ')' : '') + '</h3>' +
        wrongHTML +
      '</section>' +
      '<section class="card decide" aria-label="الخطوة التالية">' +
        '<h3>' + question + '</h3>' +
        '<div class="choices">' + primary +
        '<button type="button" class="btn outline" data-action="retry">' + ICON.retry + 'إعادة ' + f.title + '</button></div>' +
      '</section>';
  }

  function renderSummary() {
    var totalQ = 0, got = 0;
    var rows = FORMS.map(function (f, i) {
      var s = state.forms[i];
      totalQ += f.questions.length; got += s.score || 0;
      return '<li><span class="nm">' + f.title + '</span><span class="mt"><b dir="ltr">' + (s.score || 0) + '/' + f.questions.length + '</b>' +
        '<span>' + ICON.clock + '<span dir="ltr">' + fmt(s.elapsed) + '</span></span></span></li>';
    }).join('');
    var pct = Math.round(got / totalQ * 100);
    var v = verdict(pct);
    $('#qs').innerHTML =
      '<section class="card result" aria-labelledby="res-title">' +
        '<div class="res-head">' +
          '<div class="ring"><svg viewBox="0 0 116 116" aria-hidden="true">' +
            '<circle cx="58" cy="58" r="46" fill="none" stroke="var(--line)" stroke-width="11"/>' +
            '<circle cx="58" cy="58" r="46" fill="none" stroke="' + (pct >= 67 ? 'var(--good)' : pct >= 50 ? 'var(--accent)' : 'var(--bad)') + '" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + (2 * Math.PI * 46 * pct / 100).toFixed(1) + ' ' + (2 * Math.PI * 46).toFixed(1) + '"/>' +
          '</svg><b dir="ltr">' + got + '<small>/' + totalQ + '</small></b></div>' +
          '<div class="res-text"><p class="kicker">ملخص امتحان نوفمبر · <span dir="ltr">' + pct + '%</span></p>' +
          '<h2 id="res-title" tabindex="-1">' + v[0] + '</h2><p class="sub">مجموع درجاتك في النموذجين.</p></div>' +
        '</div>' +
        '<ul class="sum-list">' + rows + '</ul>' +
      '</section>' +
      '<section class="card decide"><div class="choices">' +
        '<button type="button" class="btn primary" data-action="restart">' + ICON.retry + 'بدء الامتحان من جديد</button>' +
      '</div></section>';
  }

  /* ---------- flow ---------- */
  function renderAll() {
    renderTabs();
    renderTimer();
    var quiz = state.view === 'quiz';
    $('#modes').hidden = !quiz;
    $('#progress').hidden = !quiz;
    $('#navcard').hidden = !quiz;
    if (quiz) {
      renderModes(); renderProgress(); renderNavigator(); renderQuestions(); renderActions();
    } else {
      $('#actions').innerHTML = '';
      if (state.view === 'result') renderResult(); else renderSummary();
    }
  }
  function refreshQuestion() { renderNavigator(); renderQuestions(); renderActions(); }
  function toTop() { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); }
  function focusTitle() { var h = document.getElementById('res-title'); if (h) h.focus({ preventScroll: true }); }

  function finish() {
    var s = S();
    if (answeredCount() < s.answers.length && !state.confirm) { state.confirm = true; renderActions(); return; }
    s.elapsed = Math.floor((Date.now() - s.startedAt) / 1000);
    s.score = s.answers.reduce(function (n, a, i) { return n + (a === F().questions[i].a ? 1 : 0); }, 0);
    s.done = true;
    state.confirm = false;
    state.view = 'result';
    renderAll(); toTop(); focusTitle();
  }
  function startForm(i) {
    state.form = i;
    state.forms[i] = newAttempt(FORMS[i]);
    state.index = 0; state.confirm = false; state.view = 'quiz';
    renderAll(); toTop();
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!(t instanceof HTMLInputElement) || t.type !== 'radio') return;
    S().answers[parseInt(t.name.slice(1), 10)] = parseInt(t.value, 10);
    state.confirm = false;
    renderProgress(); renderNavigator(); renderActions();
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    var act = b.dataset.action;
    if (act === 'mode') {
      state.mode = b.dataset.mode; renderModes(); refreshQuestion();
    } else if (act === 'goto') {
      var i = parseInt(b.dataset.i, 10);
      state.index = i;
      if (state.mode === 'single') refreshQuestion();
      else { var el = document.getElementById('qc' + i); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
    } else if (act === 'prev') {
      state.index = Math.max(0, state.index - 1); refreshQuestion();
    } else if (act === 'next') {
      state.index = Math.min(F().questions.length - 1, state.index + 1); refreshQuestion();
    } else if (act === 'finish') {
      finish();
    } else if (act === 'retry') {
      startForm(state.form);
    } else if (act === 'nextform') {
      startForm(state.form + 1);
    } else if (act === 'summary') {
      state.view = 'summary'; renderAll(); toTop(); focusTitle();
    } else if (act === 'restart') {
      state.forms = FORMS.map(newAttempt); state.mode = 'single';
      startForm(0);
    }
    if (act === 'prev' || act === 'next' || act === 'finish') {
      var nb = document.querySelector('#actions [data-action="' + act + '"]:not([disabled])');
      if (nb) nb.focus();
    }
  });

  setInterval(function () { if (state.view === 'quiz') renderTimer(); }, 1000);
  renderAll();
})();
</script>

</body></html>
